name: Validar y publicar Misión Aula Sin Barreras

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar estructura, privacidad y funcionalidades
        run: python -m unittest discover -s tests -v
      - name: Comprobar sintaxis del frontend
        run: |
          node --check assets/js/config.js
          node --check assets/js/app.js
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar solamente los archivos públicos
        run: |
          mkdir -p dist
          cp index.html .nojekyll dist/
          cp -R assets dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
