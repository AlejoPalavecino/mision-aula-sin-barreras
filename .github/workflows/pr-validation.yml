name: Validar PR (interfaz y seguridad)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium para prueba de interfaz
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probar estructura, privacidad y código
        run: |
          python -m unittest discover -s tests -v
          node --check assets/js/config.js
          node --check assets/js/app.js
      - name: Simular el recorrido, confirmar guardado y comprobar el modal
        run: python qa/browser_smoke.py
