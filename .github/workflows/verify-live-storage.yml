name: Prueba integral de registro (dato ficticio)

on:
  push:
    paths:
      - .github/workflows/verify-live-storage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sitio publicado, guardado único y rechazo de duplicados
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, re, urllib.request, urllib.error
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"AulaMisionQA/1.0"}),timeout=40) as response:
                  return response.read().decode("utf-8")
          cfg=pathlib.Path("assets/js/config.js").read_text(encoding="utf-8")
          match=re.search(r'appsScriptUrl:\s*"([^"]+)"',cfg)
          assert match, "Falta appsScriptUrl"
          endpoint=match.group(1)
          run_id=os.environ["GITHUB_RUN_ID"]
          email=f"qa.mision.{run_id}@example.invalid"
          def post(payload):
              req=urllib.request.Request(endpoint, data=json.dumps(payload,ensure_ascii=False).encode('utf-8'), headers={"Content-Type":"text/plain;charset=utf-8","User-Agent":"AulaMisionQA/1.0"},method="POST")
              with urllib.request.urlopen(req,timeout=50) as response:
                  body=response.read().decode("utf-8")
              try:
                  return json.loads(body)
              except Exception:
                  raise AssertionError("Apps Script no respondió JSON: "+body[:200])
          html=get("https://alejopalavecino.github.io/mision-aula-sin-barreras/")
          assert "Misión Aula Sin Barreras" in html and "./assets/js/app.js" in html
          live_cfg=get("https://alejopalavecino.github.io/mision-aula-sin-barreras/assets/js/config.js")
          assert endpoint in live_cfg, "El sitio público no usa el endpoint nuevo"
          print("Sitio público y assets configurados: OK",flush=True)
          before=post({"action":"checkEmail","email":email,"requestId":"pre-"+run_id})
          assert before.get("status")=="available",str(before)
          print("Correo ficticio disponible: OK",flush=True)
          fields={
              "email":email,
              "name":"Prueba Integracion",
              "barrier":"Cognitiva: comprensión y organización",
              "change":"Prueba automatizada temporal de conexión entre GitHub Pages y Google Sheets",
              "evidence":"Se verifica la fila guardada y se elimina al finalizar",
              "reflection":"Registro de prueba, no corresponde a un participante real",
              "website":""
          }
          first=post(dict(fields,requestId="save-"+run_id))
          assert first.get("status")=="saved",str(first)
          print("Respuesta guardada una vez: OK",flush=True)
          second=post(dict(fields,requestId="again-"+run_id))
          assert second.get("status")=="duplicate",str(second)
          print("Segundo envío rechazado: OK",flush=True)
          later=post({"action":"checkEmail","email":email,"requestId":"post-"+run_id})
          assert later.get("status")=="duplicate",str(later)
          print("Correo bloqueado después de registrar: OK",flush=True)
          PY
